<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <!--<link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">-->
  <meta name="theme-color" content="#fafafa">
</head>

<body>
<div id="stars-layer"></div>
<div class="game-container">
  <h1>TAP-A-TWINKLE</h1>
  <h2>Press button each time you catch a glimpse of a star</h2>

  <div class="top-panel">
    <div class="stat-box">
      <span class="stat-label">Score</span>
      <span class="stat-value" id="scoreDisplay">0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Time Left</span>
      <span class="stat-value" id="timerDisplay">60</span>
    </div>
  </div>

  <div class="game-area">

    <section class="play-section">
      <!--<button id="button1">a</button>-->
      <button id="button1">Start game</button>
      <p id="message"></p>
    </section>

    <section class="submit-section" id="nameSection">
      <label id="label1" for="name">Please enter your name below</label>

      <div class="submit-controls">
        <input
          type="text"
          id="name"
          name="name"
          required
          minlength="3"
          maxlength="8"
          size="16" />

        <button id="button2">Submit your score</button>
        <button id="button3">Play again</button>
      </div>
    </section>

    <section class="scoreboard-section" id="scoreboardSection">
      <h2>Scoreboard</h2>
      <ul id="scoreboardList">
        <li>Loading scoreboard...</li>
      </ul>
    </section>

  </div>
</div>
<script src="js/app.js"></script>

</body>

</html>
