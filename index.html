<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <!--<link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">-->
  <meta name="theme-color" content="#fafafa">
</head>

<body>
<div id="stars-layer"></div>
<div class="game-container">
  <h1>TAP-A-TWINKLE</h1>
  <h2>STARS WILL TWINKLE ACROSS THE SKY <br>CATCH THEM FAST BEFORE THEY PASS YOU BY</h2>
  <div class="game-status-area">
    <div class="top-panel" id="topPanel">
      <div class="stat-box">
        <span class="stat-value" id="scoreDisplay">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-value" id="timerDisplay">60</span>
      </div>
    </div>
    <p id="finalScore"></p>
  </div>
  <div class="game-area">
    <section class="play-section">
      <!--<button id="button1">a</button>-->
      <button id="button1">START GAME</button>
      <p id="message"></p>
    </section>
    <section class="submit-section" id="nameSection">
      <label id="label1" for="name">Enter your name below to submit your score</label>
      <div class="submit-controls">
        <input type="text" id="name" name="name" required minlength="3" maxlength="8" size="16" />
        <button id="button2">Submit score</button>
      </div>
    </section>
    <div id="scoreboardModal" class="modal">
      <div class="modal-content">
        <button id="closeModal">×</button>
        <section class="scoreboard-section" id="scoreboardSection">
          <h2>TOP 10 STAR CATCHERS</h2>
          <ol id="scoreboardList">
            <li>Loading scoreboard...</li>
          </ol>
        </section>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>

</body>

</html>
